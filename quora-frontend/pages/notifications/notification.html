<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Quora Clone</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/notifications.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <a href="home/index.html" class="logo">Quora</a>

                <div class="search-bar">
                    <input type="text" placeholder="Search Quora">
                </div>

                <div class="user-menu">
                    <a href="notifications.html" class="notification-icon active">
                        <img src="../assets/images/bell-icon.png" alt="Notifications" width="20">
                    </a>
                    <a href="profile/view.html">
                        <img src="../assets/images/default-avatar.jpg" alt="Profile" class="user-avatar">
                    </a>
                </div>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="notifications-container">
                <h1>Notifications</h1>

                <div class="notifications-tabs">
                    <button class="tab-btn active">All</button>
                    <button class="tab-btn">Unread</button>
                </div>

                <div id="notificationsList" class="notifications-list">
                    <!-- Notifications will be loaded here -->
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="../assets/js/notifications.js"></script>
</body>

</html>
