<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Quora Clone</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/profile.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <a href="../home/index.html" class="logo">Quora</a>

                <div class="search-bar">
                    <input type="text" placeholder="Search Quora">
                </div>

                <div class="user-menu">
                    <a href="../notifications.html" class="notification-icon">
                        <img src="../../assets/images/bell-icon.png" alt="Notifications" width="20">
                    </a>
                    <a href="view.html">
                        <img src="../../assets/images/default-avatar.jpg" alt="Profile" class="user-avatar">
                    </a>
                </div>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="profile-container">
                <div class="profile-header">
                    <div class="profile-cover"></div>
                    <div class="profile-info">
                        <img src="../../assets/images/default-avatar.jpg" alt="Profile" class="profile-avatar">
                        <h1 id="profileName" class="profile-name">Loading...</h1>
                        <p id="profileBio" class="profile-bio"></p>
                        <div class="profile-stats">
                            <div class="stat-item">
                                <span id="answersCount" class="stat-number">0</span>
                                <span class="stat-label">Answers</span>
                            </div>
                            <div class="stat-item">
                                <span id="questionsCount" class="stat-number">0</span>
                                <span class="stat-label">Questions</span>
                            </div>
                            <div class="stat-item">
                                <span id="followersCount" class="stat-number">0</span>
                                <span class="stat-label">Followers</span>
                            </div>
                        </div>
                        <button class="btn btn-outline">Edit Profile</button>
                    </div>
                </div>

                <div class="profile-tabs">
                    <button class="tab-btn active">Answers</button>
                    <button class="tab-btn">Questions</button>
                    <button class="tab-btn">Followers</button>
                    <button class="tab-btn">Following</button>
                </div>

                <div id="profileContent" class="profile-content">
                    <!-- Profile content will be loaded here -->
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="../../assets/js/profile.js"></script>
</body>

</html>
