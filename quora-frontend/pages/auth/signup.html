<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Quora Clone</title>
    <link rel="stylesheet" href="../../assets/css/auth.css">
    <link rel="stylesheet" href="../../assets/css/main.css">
</head>

<body>
    <div class="auth-container">
        <h1 class="logo">Quora</h1>
        <p class="tagline">A place to share knowledge and better understand the world</p>

        <div class="auth-box">
            <div class="terms-notice">
                By continuing you indicate that you agree to Quora's Terms of Service and Privacy Policy.
            </div>

            <button class="auth-option google-btn">
                <img src="../../assets/images/google-icon.png" alt="Google" class="auth-icon">
                Continue with Google
            </button>

            <button class="auth-option facebook-btn">
                <img src="../../assets/images/facebook-icon.png" alt="Facebook" class="auth-icon">
                Continue with Facebook
            </button>

            <div class="divider">or</div>

            <form id="signupForm" class="auth-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn btn-primary">Sign Up</button>

                <div class="auth-footer">
                    Already have an account? <a href="../auth/login.html">Login</a>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../../assets/js/auth.js"></script>
</body>

</html>
